name: CI & Portable Release Build

on:
  push:
    branches: [ main, feature/* ]
    tags:
      - "v*"
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python 3.14 on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev,full]

    - name: Run test suite
      run: |
        python -m pytest -v

  build-artifacts:
    name: Build Portable Binaries (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: er-audio-tool-windows-x64.exe
            binary_path: dist/er-audio-tool.exe
          - os: ubuntu-latest
            artifact_name: er-audio-tool-linux-x86_64
            binary_path: dist/er-audio-tool

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Install dependencies & PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev,full]
        pip install pyinstaller>=6.0

    - name: Build with PyInstaller
      run: |
        pyinstaller er_audio_tool.spec --clean --noconfirm

    - name: Rename and Prepare Binary
      shell: bash
      run: |
        mkdir -p release_out
        if [ "${{ runner.os }}" = "Windows" ]; then
          cp dist/er-audio-tool.exe release_out/${{ matrix.artifact_name }}
        else
          chmod +x dist/er-audio-tool
          cp dist/er-audio-tool release_out/${{ matrix.artifact_name }}
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: release_out/${{ matrix.artifact_name }}

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download all built artifacts
      uses: actions/download-artifact@v4
      with:
        path: release_binaries
        merge-multiple: true

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: release_binaries/*
        draft: false
        prerelease: false
        generate_release_notes: true

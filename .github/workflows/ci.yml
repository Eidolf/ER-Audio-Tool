name: CI Pipeline

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python 3.14 on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev,full]

    - name: Run test suite
      run: |
        python -m pytest -v

  build-check:
    name: Build Artifacts Check (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: er-audio-tool-windows-x64.exe
            binary_path: dist/er-audio-tool.exe
          - os: ubuntu-latest
            artifact_name: er-audio-tool-linux-x86_64
            binary_path: dist/er-audio-tool

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Install dependencies & PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev,full]
        pip install pyinstaller>=6.0

    - name: Determine Version
      id: ver
      shell: bash
      run: |
        RAW_TAG=$(git describe --tags --always 2>/dev/null || echo "1.3.1")
        CLEAN_VER="${RAW_TAG#v}"
        echo "version=${CLEAN_VER}" >> $GITHUB_OUTPUT
        echo "${CLEAN_VER}" > _version.txt
        echo "Building version: ${CLEAN_VER}"

    - name: Build with PyInstaller
      env:
        APP_VERSION: ${{ steps.ver.outputs.version }}
      run: |
        pyinstaller er_audio_tool.spec --clean --noconfirm

    - name: Rename and Prepare Binary
      shell: bash
      run: |
        mkdir -p release_out
        if [ "${{ runner.os }}" = "Windows" ]; then
          cp dist/er-audio-tool.exe release_out/${{ matrix.artifact_name }}
        else
          chmod +x dist/er-audio-tool
          cp dist/er-audio-tool release_out/${{ matrix.artifact_name }}
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: release_out/${{ matrix.artifact_name }}

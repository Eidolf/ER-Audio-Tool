name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag / Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-release-binaries:
    name: Build Portable Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: er-audio-tool-windows-x64.exe
            binary_path: dist/er-audio-tool.exe
          - os: ubuntu-latest
            artifact_name: er-audio-tool-linux-x86_64
            binary_path: dist/er-audio-tool

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Install dependencies & PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev,full]
        pip install pyinstaller>=6.0

    - name: Build with PyInstaller
      run: |
        pyinstaller er_audio_tool.spec --clean --noconfirm

    - name: Prepare Binary
      shell: bash
      run: |
        mkdir -p release_out
        if [ "${{ runner.os }}" = "Windows" ]; then
          cp dist/er-audio-tool.exe release_out/${{ matrix.artifact_name }}
        else
          chmod +x dist/er-audio-tool
          cp dist/er-audio-tool release_out/${{ matrix.artifact_name }}
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: release_out/${{ matrix.artifact_name }}

  publish-release:
    name: Publish GitHub Release
    needs: build-release-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download all built binaries
      uses: actions/download-artifact@v4
      with:
        path: release_binaries
        merge-multiple: true

    - name: Determine Tag
      id: get_tag
      shell: bash
      run: |
        if [ -n "${{ github.event.inputs.tag_name }}" ]; then
          echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
        else
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        fi

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_tag.outputs.tag }}
        name: ${{ steps.get_tag.outputs.tag }}
        files: release_binaries/*
        draft: false
        prerelease: false
        generate_release_notes: true
